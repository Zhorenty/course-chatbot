services:
  course-chatbot:
    container_name: course-chatbot
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PAYMENT_WEBHOOK_BIND: 0.0.0.0:8080
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
      - ./assets:/app/assets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
